<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<title>Bucs Basketball Stats (BETA)</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0a0a0a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Bucs Stats BETA">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{--red:#d3121d;--red2:#ff2a35;--bg:#0a0a0a;--card:#18181a;--card2:#222226;--line:#2f2f34;--txt:#fff;--mut:#a5a5ad}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--txt);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;overscroll-behavior:none}
body{padding-bottom:env(safe-area-inset-bottom)}
button,select,input,textarea{font:inherit;color:inherit;touch-action:manipulation}
button{background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:12px 14px;min-height:48px;font-weight:700;cursor:pointer;user-select:none;-webkit-user-select:none}
button:active{filter:brightness(1.4)}
button.red{background:var(--red);border-color:var(--red2)}
button.ghost{background:transparent}
button:disabled{opacity:.35}
input,select,textarea{background:#101012;border:1px solid var(--line);border-radius:10px;padding:10px 12px;min-height:44px;width:100%}
h3{margin:18px 0 8px;font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--mut)}
.pad{padding:12px 14px 110px;max-width:640px;margin:0 auto}
.hdr{display:flex;align-items:center;gap:12px;padding:calc(10px + env(safe-area-inset-top)) 14px 10px;background:linear-gradient(#1a0305,#0a0a0a);border-bottom:2px solid var(--red);position:sticky;top:0;z-index:5}
.logo{width:46px;height:46px;flex:none}
.hdr .t{flex:1;min-width:0}
.hdr .t b{display:block;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hdr .t span{font-size:12px;color:var(--mut)}
.hdr button{min-height:40px;padding:8px 12px}
.big{display:block;width:100%;font-size:19px;padding:18px;margin:10px 0}
.row{display:flex;gap:8px;margin:8px 0}
.row>*{flex:1}
.list .it{display:flex;justify-content:space-between;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin:8px 0}
.it small{color:var(--mut)}
.W{color:#4ade80}.L{color:var(--red2)}.T{color:var(--mut)}
.grid{display:grid;gap:8px}
.pick{grid-template-columns:repeat(2,1fr)}
.pick button{text-align:left;display:flex;gap:10px;align-items:center;min-height:58px}
.pick button b{font-size:22px;min-width:38px}
.pick button.on{background:var(--red);border-color:var(--red2)}
.score{display:flex;align-items:stretch;gap:8px;padding:10px 14px 0;max-width:640px;margin:0 auto}
.score .us,.score .op{flex:1;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 10px}
.score .us,.score .op{min-width:0}.score small{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--mut);font-size:11px;letter-spacing:.06em}
.score .n{font-size:34px;font-weight:800;line-height:1}
.score .us .n{color:var(--red2)}
.oppb{display:flex;gap:4px;margin-top:6px}
.oppb button{flex:1;min-height:36px;padding:4px;font-size:13px}
.qbar{display:flex;align-items:center;gap:8px;padding:10px 14px 0;max-width:640px;margin:0 auto}
.qbar .q{background:var(--red);border-radius:10px;padding:10px 14px;font-weight:800;font-size:18px}
.qbar .clk{flex:1;font-size:30px;font-weight:800;text-align:center;font-variant-numeric:tabular-nums}
.qbar button{min-width:92px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;padding:10px 14px 0;max-width:640px;margin:0 auto}
.stats button{min-height:54px;padding:6px 2px;font-size:14px}
.stats button.on{background:var(--red);border-color:#fff;box-shadow:0 0 0 2px #fff}
.stats button.sub.on{background:#fff;color:#000}
.help{background:#141416;border:1px solid var(--red);border-radius:12px;padding:12px 14px;margin:8px 0;font-size:14px}.help ol{margin:6px 0 10px 18px;padding:0}.help li{margin:4px 0}.pc.subtarget{border-color:#fff}
a.lnk{display:block;text-align:center;padding:14px;margin:8px 0;border:1px solid var(--line);border-radius:12px;color:#fff;text-decoration:none;font-weight:700;background:var(--card2)}a.it{color:#fff;text-decoration:none}tr.onfl td{background:#2a0a0d}
.hdr .tsw{background:none;border:0;padding:0;min-height:0;font:inherit;font-weight:700;font-size:17px;color:inherit;text-align:left;max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}.pc.subsel{border-color:#fff;background:#3a1014}.rr2{display:grid;grid-template-columns:1fr 92px 92px;gap:8px;align-items:center;margin:6px 0}.rr2 span{font-weight:700}
.hint{padding:6px 16px 0;font-size:12px;color:var(--mut);max-width:640px;margin:0 auto}
.floor{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:10px 14px 0;max-width:640px;margin:0 auto}
.floor .pc:last-child:nth-child(odd){grid-column:1/-1}
.pc{background:var(--card);border:2px solid var(--line);border-radius:14px;padding:10px 12px;min-height:96px;text-align:left;display:block;width:100%}
.pc.target{border-color:var(--red2);background:#2a0a0d}
.pc .top{display:flex;justify-content:space-between;align-items:baseline}
.pc .num{font-size:38px;font-weight:900;line-height:1}
.pc .pts{font-size:28px;font-weight:800;color:var(--red2)}
.pc .pts small{font-size:11px;color:var(--mut);margin-left:3px}
.pc .nm{font-size:13px;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pc .mini{font-size:12px;color:var(--mut);margin-top:2px;letter-spacing:.03em}
.bar{position:fixed;left:0;right:0;bottom:0;background:#0d0d0f;border-top:2px solid var(--red);padding:8px 12px calc(8px + env(safe-area-inset-bottom));z-index:6}
.bar .last{font-size:12px;color:var(--mut);text-align:center;margin-bottom:6px;min-height:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar .row{margin:0;max-width:640px;margin:0 auto}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.72);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sh{background:#141416;border-top:3px solid var(--red);border-radius:18px 18px 0 0;width:100%;max-width:640px;padding:16px 14px calc(16px + env(safe-area-inset-bottom));max-height:88vh;overflow:auto}
.sh h2{margin:0 0 12px;font-size:18px}
.pts3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.pts3 button{font-size:40px;min-height:100px;background:var(--red);border-color:var(--red2)}
.pts3 button small{display:block;font-size:12px;font-weight:600}
#toast{position:fixed;left:50%;top:calc(70px + env(safe-area-inset-top));transform:translateX(-50%);background:#fff;color:#000;padding:10px 16px;border-radius:999px;font-weight:700;font-size:14px;z-index:30;opacity:0;pointer-events:none;transition:opacity .15s;max-width:92vw;text-align:center}
#toast.show{opacity:1}
.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:12px}
table{border-collapse:collapse;width:100%;font-size:13px;font-variant-numeric:tabular-nums}
th,td{padding:8px 6px;text-align:center;white-space:nowrap;border-bottom:1px solid var(--line)}
th{background:var(--red);font-size:11px;letter-spacing:.05em;position:sticky;top:0}
td.nm,th.nm{text-align:left;padding-left:8px}
tr.tot td{font-weight:800;background:var(--card2)}
.fin{font-size:22px;font-weight:800;text-align:center;margin:10px 0}
textarea{min-height:200px;font-size:13px;font-family:ui-monospace,Menlo,monospace}
.rr{display:grid;grid-template-columns:70px 1fr 44px;gap:6px;margin:6px 0}
.rr button{min-height:44px;padding:0}
.warn{background:#3a2a00;border:1px solid #8a6a00;border-radius:10px;padding:10px;font-size:13px;margin:8px 0}
label{font-size:12px;color:var(--mut);display:block;margin:10px 0 4px}
.cnt{font-size:15px;color:var(--mut);margin:4px 0 8px}
</style>
</head>

<div id="app"></div>
<div id="sheet"></div>
<div id="toast"></div>

const KEY="bb_stats_beta",BAK="bb_stats_beta_bak";
const LBL={pts:"Points",ast:"Assist",to:"Turnover",stl:"Steal",reb:"Rebound",blk:"Block",pf:"Foul"};
const periods=g=>g.periods||4;
const perLen=(g,q)=>((q<=periods(g)?(g.plen||7):((g.ot&&g.ot[q-periods(g)-1])||3))*60);
const plabel=(g,q)=>q>periods(g)?"OT"+(q-periods(g)):(g.fmt==="h"?"H":"Q")+q;
const pword=g=>g.fmt==="h"?"Half":"Quarter";
const DEF_HELPER=["ast","to","stl","reb","blk"];
const defaultAssign=()=>({pts:"me",ast:"me",to:"me",stl:"me",reb:"me",blk:"me",pf:"me"});
const assignOf=(g,k)=>g.assign&&g.assign[k]?g.assign[k]:(isHelper(g)&&DEF_HELPER.includes(k)?"helper":"me");
const myStats=g=>{const w=isHelper(g)?"helper":"me";return Object.keys(LBL).filter(k=>assignOf(g,k)===w);};
const NG={fmt:"q"};
let S,view="home",boxId=null,sel=null,subMode=false,subOut=[],subIn=[],pick=[],canSave=true,lineupFix=false;

const $=s=>document.querySelector(s);
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uid=()=>Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-3);
const byNum=(a,b)=>(parseInt(a.num,10)||0)-(parseInt(b.num,10)||0)||String(a.num).localeCompare(String(b.num));

function defaultState(){
  const t={id:uid(),name:"My Team",grade:"",floor:5,roster:[]};
  return {teams:[t],teamId:t.id,games:[],gameId:null,seenHelp:false};
}
function readStore(){try{const r=localStorage.getItem(KEY);return r?JSON.parse(r):null;}catch(e){return null;}}
function load(){const o=readStore();return o&&o.teams&&o.teams.length?o:null;}
let lastBak=0;
function maybeBackup(force){
  if(!S||!S.games||!S.games.length)return;
  const now=Date.now();if(!force&&now-lastBak<60000)return;
  lastBak=now;try{localStorage.setItem(BAK,JSON.stringify({at:now,s:S}));}catch(e){}
}
function save(skip){
  try{
    const cur=readStore();
    if(cur&&cur.games&&(cur.rev||0)>(S.rev||0)){ // newer data was saved by another tab or page: keep it, and add anything new from this page
      const have=new Set(cur.games.map(g=>g.id));
      S.games.forEach(g=>{if(!have.has(g.id))cur.games.push(g);});
      S=cur;
    }
    S.rev=(S.rev||0)+1;
    localStorage.setItem(KEY,JSON.stringify(S));canSave=true;
    maybeBackup(false);
  }catch(e){canSave=false;}
  if(!skip)queueSync();
}
function refreshFromStore(){
  const cur=readStore();
  if(cur&&cur.teams&&cur.teams.length&&(cur.rev||0)>(S.rev||0)){S=cur;render();}
}
{
  let raw=null;try{raw=localStorage.getItem(KEY);}catch(e){}
  S=load();
  if(!S){
    if(raw){try{localStorage.setItem(KEY+"_corrupt",raw);}catch(e){}}
    S=defaultState();
    if(!raw)save(true);
  }
}

const team=()=>S.teams.find(t=>t.id===S.teamId)||S.teams[0];
const game=()=>S.games.find(g=>g.id===S.gameId);
const fmtDate=d=>new Date(d).toLocaleDateString(undefined,{month:"short",day:"numeric",year:"numeric"});
const dn=n=>{const p=String(n||"").trim().split(/\s+/).filter(Boolean);if(p.length<2)return p[0]||"";return p[0]+" "+p[p.length-1][0].toUpperCase()+".";};
const pnm=(g,id)=>{const p=g.roster.find(x=>x.id===id);return p?`#${p.num} ${dn(p.name)}`:"?";};

function mkGame(t,opp,fmt,len){
  return {id:uid(),teamId:t.id,teamName:t.name,grade:t.grade,date:new Date().toISOString(),opp:opp,oppScore:0,q:1,fmt:fmt||"q",periods:fmt==="h"?2:4,plen:len||7,ot:[],assign:null,
    floorSize:t.floor||5,roster:t.roster.map(p=>({...p})),floor:[],qStart:{},events:[],clock:{el:0,run:null},cu:{},needLineup:true,done:false};
}

/* ---------- clock ---------- */
function elapsedMs(g){return g.clock.el+(g.clock.run?Date.now()-g.clock.run:0);}
function clockText(g){const rem=Math.max(0,perLen(g,g.q)*1000-elapsedMs(g));const s=Math.ceil(rem/1000);return Math.floor(s/60)+":"+String(s%60).padStart(2,"0");}
function pauseClock(g){if(g.clock.run){g.clock.el+=Date.now()-g.clock.run;g.clock.run=null;}}
setInterval(()=>{
  const g=game();const el=$("#clk");
  if(!g||!el||view!=="game")return;
  if(g.clock.run&&elapsedMs(g)>=perLen(g,g.q)*1000){g.clock.el=perLen(g,g.q)*1000;g.clock.run=null;save();try{navigator.vibrate&&navigator.vibrate([200,100,200]);}catch(e){}toast("Time! End the "+pword(g).toLowerCase()+" when ready");render();return;}
  el.textContent=clockText(g);
},250);

/* ---------- stats ---------- */
function totals(g){
  const T={};g.roster.forEach(p=>T[p.id]={pts:0,ast:0,to:0,stl:0,reb:0,blk:0,pf:0});
  g.events.forEach(e=>{if(e.type!=="stat")return;const t=T[e.pid];if(!t)return;if(e.stat==="pts")t.pts+=e.v;else t[e.stat]++;});
  return T;
}
function usScore(g){return g.events.reduce((a,e)=>a+(e.type==="stat"&&e.stat==="pts"?e.v:0),0);}
function subTimes(subs,used,L){
  if(used)return subs.map(e=>Math.min(L,e.t||0));
  const keys=[];subs.forEach(e=>{const k=e.grp||e.id;if(!keys.includes(k))keys.push(k);});
  return subs.map(e=>Math.round(L*(keys.indexOf(e.grp||e.id)+1)/(keys.length+1)));
}
function minutes(g){
  const sec={};g.roster.forEach(p=>sec[p.id]=0);
  for(let q=1;q<=g.q;q++){
    const start=g.qStart[q];if(!start)continue;
    const over=q<g.q||g.done,used=!!g.cu[q],L=perLen(g,q);
    if(!over&&!used)continue;
    const subs=g.events.filter(e=>e.type==="sub"&&e.q===q);
    const times=subTimes(subs,used,L);
    const on=new Map();start.forEach(id=>on.set(id,0));
    subs.forEach((e,i)=>{
      const t=times[i];
      if(on.has(e.out)){sec[e.out]+=Math.max(0,t-on.get(e.out));on.delete(e.out);}
      on.set(e.in,t);
    });
    const end=over?L:Math.min(L,Math.round(elapsedMs(g)/1000));
    on.forEach((t0,id)=>{sec[id]+=Math.max(0,end-t0);});
  }
  return sec;
}
const mins=s=>Math.round(s/60);

/* ---------- ui helpers ---------- */
function toast(m){const t=$("#toast");t.textContent=m;t.classList.add("show");clearTimeout(toast.h);toast.h=setTimeout(()=>t.classList.remove("show"),1700);}
function openSheet(h){$("#sheet").innerHTML=`<div class="ov"><div class="sh">${h}</div></div>`;}
function closeSheet(){$("#sheet").innerHTML="";}
function hdr(title,sub,back,tsw){
  return `<div class="hdr"><img class="logo" src="${LOGO}" alt="Allatoona Athletics logo"><div class="t"><b>${tsw?`<button class="tsw" data-a="teamsheet">${esc(title)} ▾</button>`:esc(title)}</b><span>${esc(sub||"")}</span></div>${back?`<button class="ghost" data-a="go" data-v="${back}">Back</button>`:""}</div>`;
}
function go(v){view=v;sel=null;subMode=false;subOut=[];subIn=[];closeSheet();render();window.scrollTo(0,0);}

/* ---------- views ---------- */
function vHome(){

  <button class="big ${inprog||empty?"":"red"}" data-a="newgame">New Game</button>
  <div class="row"><button data-a="go" data-v="season">Season Totals</button><button data-a="go" data-v="roster">Team &amp; Roster</button></div>
  <h3>Past games</h3><div class="list">
  ${past.length?past.map(g=>{const u=usScore(g),o=g.oppScore||0,r=u>o?"W":u<o?"L":"T";return `<div class="it" data-a="box" data-id="${g.id}"><div><b>vs ${esc(g.opp||"Opponent")}</b><br><small>${fmtDate(g.date)}</small></div><div class="${r}"><b>${r} ${u}–${o}</b></div></div>`;}).join(""):`<div class="it"><small>No finished games yet.</small></div>`}
  </div>

  <div class="hint" style="padding:14px 0 0">Tip: add this page to your home screen (browser menu → "Add to Home screen" or "Install app"). It then opens like an app and works with no signal. Games are saved on this phone only.</div>

  </div>`;

function vLineup(){
  const g=game();if(!g){view="home";return vHome();}
  const n=g.floorSize;
  return hdr(`${plabel(g,g.q)}: who's on the floor?`,`${g.teamName} vs ${g.opp||"Opponent"}`)+`<div class="pad">
  <div class="cnt">Pick ${n} players — <b>${pick.length}/${n}</b> selected</div>
  <div class="grid pick">${g.roster.slice().sort(byNum).map(p=>`<button class="${pick.includes(p.id)?"on":""}" data-a="lpick" data-id="${p.id}"><b>${esc(p.num)}</b><span>${esc(dn(p.name))}</span></button>`).join("")}</div>
  </div>
  <div class="bar"><div class="row"><button class="red" data-a="lstart" ${pick.length===n?"":"disabled"}>${lineupFix?"Save Lineup":"Start "+plabel(g,g.q)}</button></div></div>`;
}

function lastText(g){
  const e=g.events[g.events.length-1];if(!e)return "";
  if(e.type==="sub"&&e.grp)return g.events.filter(x=>x.grp===e.grp).map(x=>evText(g,x)).join(" · ");
  return evText(g,e);
}
function vGame(){
  const g=game();if(!g){view="home";return vHome();}
  const hp=isHelper(g);
  const lab=plabel(g,g.q);
  if(g.needLineup){
    if(hp)return hdr(g.teamName,`HELPER · vs ${g.opp||"Opponent"}`)+`<div class="pad"><div class="help"><b>Waiting for the scorekeeper…</b><br>They're picking the lineup for ${lab}. This screen updates by itself.</div><button class="big" data-a="box" data-id="${g.id}">View Box Score</button><button class="big ghost" data-a="go" data-v="home">Leave</button></div>`;
    view="lineup";pick=[];return vLineup();
  }
  const T=totals(g),us=usScore(g);
  const hasOwn=g.events.some(e=>!e.remote);
  const noEv=g.events.every(e=>e.q!==g.q);
  const mine=myStats(g);
  const SH={pts:"PTS",ast:"AST",to:"TO",stl:"STL",reb:"REB",blk:"BLK",pf:"FOUL"};
  const statBtn=k=>`<button class="${sel===k?"on":""}" data-a="stat" data-s="${k}">${SH[k]}</button>`;
  const tag=g.cloud?(hp?"HELPER · ":"LIVE · "):"";
  const collab=isOwner(g)&&g.cloud.collab;
  const lastP=g.q>=periods(g);
  const hint=sel?`Now tap the player for <b>${LBL[sel]}</b>`:subMode?`Tap each player going <b>OUT</b>${subOut.length?` · ${subOut.length} selected`:""}`:hp?(mine.length?`You're covering: <b>${mine.map(k=>SH[k]).join(", ")}</b>`:"The scorekeeper hasn't given you any stats yet."):"Pick a stat, or tap SUB to make a substitution.";
  return hdr(g.teamName,`${tag}${g.grade?g.grade+" ":""}vs ${g.opp||"Opponent"}`)+`
  <div class="score">
    <div class="us"><small>${esc(g.teamName.toUpperCase())}</small><div class="n">${us}</div></div>
    <div class="op"><small>${esc((g.opp||"OPPONENT").toUpperCase())}</small><div class="n">${g.oppScore||0}</div>
      ${hp?"":`<div class="oppb"><button data-a="opp" data-v="-1">−1</button><button data-a="opp" data-v="1">+1</button><button data-a="opp" data-v="2">+2</button><button data-a="opp" data-v="3">+3</button></div>`}</div>
  </div>
  ${hp?`<div class="qbar"><div class="q">${lab}</div><div class="clk" style="font-size:15px;color:var(--mut)">Scorekeeper runs the lineup</div></div>`:`<div class="qbar"><div class="q">${lab}</div><div class="clk" id="clk">${clockText(g)}</div><button class="${g.clock.run?"":"red"}" data-a="clock">${g.clock.run?"Pause":"Start"}</button></div>`}
  <div class="stats">${Object.keys(LBL).filter(k=>mine.includes(k)).map(statBtn).join("")}${hp?"":`<button class="sub ${subMode?"on":""}" data-a="stat" data-s="sub">SUB</button>`}</div>
  <div class="hint">${hint}</div>
  ${subMode&&subOut.length?`<div class="row" style="padding:8px 14px 0;max-width:640px;margin:0 auto"><button class="red" data-a="subpick">Choose Replacements (${subOut.length})</button><button class="ghost" data-a="subclear">Clear</button></div>`:""}
  <div class="floor">${g.floor.map(id=>g.roster.find(x=>x.id===id)).filter(Boolean).sort(byNum).map(p=>{const id=p.id;const t=T[id];return `<button class="pc ${sel?"target":subMode?(subOut.includes(id)?"subsel":"subtarget"):""}" data-a="pl" data-id="${id}"><div class="top"><span class="num">${esc(p.num)}</span><span class="pts">${t.pts}<small>PTS</small></span></div><div class="nm">${esc(dn(p.name))}</div><div class="mini">A${t.ast} · S${t.stl} · R${t.reb} · B${t.blk} · TO${t.to} · F${t.pf}</div></button>`;}).join("")}</div>
  <div class="row" style="padding:10px 14px 0;max-width:640px;margin:0 auto;flex-wrap:wrap">${!hp&&noEv?`<button class="ghost" data-a="fixlineup">Fix Lineup</button>`:""}${collab?`<button class="ghost" data-a="assign">Assign Stats</button><button class="ghost" data-a="hentries">Helper Entries</button>`:""}${hp?"":`<button class="ghost" data-a="sharesheet">${g.cloud?"Sharing":"Share Live"}</button>`}</div>
  <div class="pad" style="padding-top:0"></div>
  <div class="bar"><div class="last">${g.events.length?"Last: "+esc(lastText(g)):"&nbsp;"}</div>
    <div class="row"><button data-a="undo" ${hasOwn?"":"disabled"}>↩ Undo</button>${hp?"":`<button class="red" data-a="qover">${lastP?"End Game":(g.fmt==="h"?"Half Over":"Quarter Over")}</button>`}<button data-a="box" data-id="${g.id}">Box</button></div></div>`;
}
function openSubSheet(g){
  const bench=g.roster.filter(p=>!g.floor.includes(p.id)).sort(byNum),n=subOut.length;
  openSheet(`<h2>Coming in (${subIn.length}/${n})</h2><div class="cnt">Going out: ${subOut.map(id=>esc(pnm(g,id))).join(", ")}</div><div class="grid pick">${bench.map(p=>{const k=subIn.indexOf(p.id);return `<button class="${k>=0?"on":""}" data-a="subtog" data-id="${p.id}"><b>${esc(p.num)}</b><span>${esc(dn(p.name))}${k>=0?" ✓":""}</span></button>`;}).join("")}</div><div class="row" style="margin-top:12px"><button class="ghost" data-a="close">Cancel</button><button class="red" data-a="subgo" ${subIn.length===n?"":"disabled"}>${n>1?"Make "+n+" Subs":"Make Sub"}</button></div>`);
}
function openAssign(g){
  const rows=Object.keys(LBL).map(k=>{const w=assignOf(g,k);return `<div class="rr2"><span>${LBL[k]}</span><button class="${w==="me"?"red":""}" data-a="asg" data-k="${k}" data-w="me">Me</button><button class="${w==="helper"?"red":""}" data-a="asg" data-k="${k}" data-w="helper">Helper</button></div>`;}).join("");
  openSheet(`<h2>Assign Stats</h2><div class="cnt">Each stat is on one phone at a time. Tap <b>Me</b> to take a stat back. It disappears from the helper's phone right away.</div>${rows}<div class="row" style="margin-top:12px"><button class="red" data-a="close">Done</button></div>`);

function openHelperEntries(g){
  const rem=g.events.filter(e=>e.remote&&e.type==="stat").slice(-20).reverse();
  openSheet(`<h2>Helper Entries</h2><div class="cnt">Remove a wrong entry. It disappears on the helper's phone too.</div>${rem.length?rem.map(e=>`<div style="display:flex;justify-content:space-between;align-items:center;gap:8px;margin:6px 0;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 10px"><div style="font-size:14px">${esc(evText(g,e))}</div><button data-a="rmhe" data-id="${e.id}" style="min-height:40px;padding:6px 12px">Remove</button></div>`).join(""):`<div class="hint" style="padding:0">No helper entries yet.</div>`}<div class="row" style="margin-top:12px"><button class="red" data-a="close">Done</button></div>`);
}
function otSheet(g,title,cnt){
  const len=g.ot&&g.ot.length?g.ot[g.ot.length-1]:3;
  openSheet(`<h2>${title}</h2><div class="cnt">${cnt}</div><label>Overtime minutes</label><input id="otin" type="number" inputmode="numeric" min="1" max="30" value="${len}"><div class="row" style="margin-top:14px"><button class="ghost" data-a="${title.startsWith("Tied")?"qgo":"close"}">${title.startsWith("Tied")?"No, End Game":"Cancel"}</button><button class="red" data-a="otstart">Start Overtime</button></div>`);
}
function evText(g,e){
  if(e.type==="sub")return `${pnm(g,e.in)} in for ${pnm(g,e.out)}`;
  return `${pnm(g,e.pid)} · ${e.stat==="pts"?"+"+e.v+" pt"+(e.v>1?"s":""):LBL[e.stat]}`;
}

function statRow(p,t,m,extra){
  return `<tr><td>${esc(p.num)}</td><td class="nm">${esc(dn(p.name))}</td>${extra||""}<td><b>${t.pts}</b></td><td>${t.ast}</td><td>${t.to}</td><td>${t.stl}</td><td>${t.reb}</td><td>${t.blk}</td><td>${t.pf}</td><td>${m}</td></tr>`;
}
function vBox(){
  const g=S.games.find(x=>x.id===boxId);if(!g){view="home";return vHome();}
  const T=totals(g),M=minutes(g),u=usScore(g),o=g.oppScore||0,r=u>o?"W":u<o?"L":"T";
  const tot={pts:0,ast:0,to:0,stl:0,reb:0,blk:0,pf:0};
  const rows=g.roster.slice().sort(byNum).map(p=>{const t=T[p.id];for(const k in tot)tot[k]+=t[k];return statRow(p,t,mins(M[p.id]));}).join("");
  const text=sumText(g);
  return hdr(`vs ${g.opp||"Opponent"}`,`${fmtDate(g.date)} · ${g.done?"Final":"In progress ("+plabel(g,g.q)+")"}`,g.done?"home":"game")+`<div class="pad">
  ${!g.done&&g.needLineup&&!isHelper(g)?`<div class="help" style="margin-top:0"><b>${plabel(g,g.q-1)} is over.</b> Look over the stats, then pick the lineup when you're ready.<button class="big red" data-a="lineupnow">Pick Lineup for ${plabel(g,g.q)}</button></div>`:""}<div class="fin ${r}">${esc(g.teamName)} ${u} – ${esc(g.opp||"Opp")} ${o} ${g.done?`(${r})`:""}</div>
  <div class="tbl"><table><tr><th>#</th><th class="nm">PLAYER</th><th>PTS</th><th>AST</th><th>TO</th><th>STL</th><th>REB</th><th>BLK</th><th>PF</th><th>MIN</th></tr>${rows}
  <tr class="tot"><td></td><td class="nm">TEAM</td><td>${tot.pts}</td><td>${tot.ast}</td><td>${tot.to}</td><td>${tot.stl}</td><td>${tot.reb}</td><td>${tot.blk}</td><td>${tot.pf}</td><td></td></tr></table></div>
  <div class="hint" style="padding:6px 0">Minutes come from the clock when it was used, otherwise they're estimated from the sub order.</div>
  <label>Opponent name</label><input data-f="oppname" value="${esc(g.opp)}" placeholder="Opponent">
  <label>Opponent final score</label><input data-f="oppscore" type="number" inputmode="numeric" value="${o}">
  ${liveBlock(g)}
  <h3>Summary to send to the coach</h3>
  <textarea id="sum" readonly>${esc(text)}</textarea>
  <div class="row"><button class="red" data-a="share">Share With Coach</button><button data-a="copy">Copy</button></div><div class="row"><button class="ghost" data-a="delgame" data-id="${g.id}">Delete Game</button></div>
  </div>`;
}
function sumText(g){
  const T=totals(g),M=minutes(g),u=usScore(g),o=g.oppScore||0,r=u>o?"W":u<o?"L":"T";
  let s=`${g.teamName}${g.grade?" ("+g.grade+")":""} vs ${g.opp||"Opponent"} – ${fmtDate(g.date)}\nFinal: ${g.teamName} ${u}, ${g.opp||"Opponent"} ${o} (${r})${g.done?"":" – in progress"}\n\nPTS / AST / TO / STL / REB / BLK / PF / MIN\n`;
  g.roster.slice().sort(byNum).forEach(p=>{const t=T[p.id];s+=`#${p.num} ${dn(p.name)}: ${t.pts} / ${t.ast} / ${t.to} / ${t.stl} / ${t.reb} / ${t.blk} / ${t.pf} / ${mins(M[p.id])}\n`;});
  return s;
}

function vSeason(){
  const t=team(),games=S.games.filter(g=>g.done&&g.teamId===t.id);
  const A={};let w=0,l=0,pf=0,pa=0;
  games.forEach(g=>{
    const T=totals(g),M=minutes(g),u=usScore(g),o=g.oppScore||0;
    if(u>o)w++;else if(u<o)l++;pf+=u;pa+=o;
    g.roster.forEach(p=>{
      const x=T[p.id],m=M[p.id];
      if(!(m>0||x.pts||x.ast||x.to||x.stl||x.reb||x.blk||x.pf))return;
      const a=A[p.id]||(A[p.id]={num:p.num,name:p.name,gp:0,pts:0,ast:0,to:0,stl:0,reb:0,blk:0,pf:0,sec:0});
      a.num=p.num;a.name=p.name;a.gp++;a.sec+=m;for(const k of ["pts","ast","to","stl","reb","blk","pf"])a[k]+=x[k];
    });
  });
  const list=Object.values(A).sort(byNum);
  const rows=list.map(a=>`<tr><td>${esc(a.num)}</td><td class="nm">${esc(dn(a.name))}</td><td>${a.gp}</td><td><b>${a.pts}</b></td><td>${(a.pts/a.gp).toFixed(1)}</td><td>${a.ast}</td><td>${a.to}</td><td>${a.stl}</td><td>${a.reb}</td><td>${a.blk}</td><td>${a.pf}</td><td>${mins(a.sec/a.gp)}</td></tr>`).join("");
  return hdr("Season Totals",`${t.name} · ${t.grade}`,"home")+`<div class="pad">
  <div class="fin">${w}–${l} · ${games.length?`${pf} for, ${pa} against`:"no games yet"}</div>
  ${list.length?`<div class="tbl"><table><tr><th>#</th><th class="nm">PLAYER</th><th>GP</th><th>PTS</th><th>PPG</th><th>AST</th><th>TO</th><th>STL</th><th>REB</th><th>BLK</th><th>PF</th><th>MPG</th></tr>${rows}</table></div>`:`<div class="list"><div class="it"><small>Finish a game and it shows up here.</small></div></div>`}
  </div>`;
}

function trashAdd(it){S.trash=S.trash||[];it.id=uid();it.at=Date.now();S.trash.push(it);if(S.trash.length>15)S.trash.shift();}
function trashHtml(){
  const tr=(S.trash||[]).slice().reverse();if(!tr.length)return "";

function gameDoc(g,me){
  return clean({owner:me,teamId:g.cloud.tid,teamName:g.teamName,grade:g.grade||"",opp:g.opp||"",us:usScore(g),them:g.oppScore||0,q:g.q,fmt:g.fmt||"q",periods:periods(g),plen:g.plen||7,ot:g.ot||[],assign:g.assign||null,done:!!g.done,date:g.date,needLineup:!!g.needLineup,floorSize:g.floorSize,floorIds:g.floor,qStart:g.qStart,roster:g.roster.map(p=>({id:p.id,n:p.num,nm:dn(p.name)})),box:boxOf(g)});
}

/* ----- syncing (local copy is always the source of truth; the cloud mirrors it) ----- */
const hasCloud=()=>S.games.some(g=>g.cloud&&!g.cloud.off&&!g.cloud.gone);
function queueSync(){
  if(syncTimer||!hasCloud())return;
  syncTimer=setTimeout(()=>{syncTimer=null;syncAll();},3000);
}
async function syncAll(){
  if(syncBusy)return;
  if(navigator.onLine===false){syncState="wait";return;}
  syncBusy=true;
  try{
    for(const g of S.games.slice()){if(g.cloud&&!g.cloud.off&&!g.cloud.gone)await syncGame(g);}
    syncState="ok";
  }catch(e){syncState="wait";}
  finally{syncBusy=false;save(true);if(syncAgain){syncAgain=false;setTimeout(syncAll,50);}}
}
function syncNow(){clearTimeout(syncTimer);syncTimer=null;if(syncBusy){syncAgain=true;return;}syncAll();}
async function syncGame(g){
  const c=g.cloud;if(!c)return;
  const me=await fbAuth();
  const gref=fs.collection("games").doc(c.gid);
  if(c.role==="owner"){
    const d=gameDoc(g,me),h=JSON.stringify(d);
    if(h!==c.h){d.updated=firebase.firestore.FieldValue.serverTimestamp();await gref.set(d);c.h=h;}
    const t=S.teams.find(x=>x.id===g.teamId);
    if(t&&t.cloudId)await syncTeam(t,me);
  }
  if(c.collab||c.role==="helper")await syncEvents(g,me,gref);
  c.last=Date.now();
}
async function syncEvents(g,me,gref){
  const c=g.cloud,own=g.events.filter(e=>!e.remote);
  const ids=new Set(own.map(e=>e.id));
  const todo=own.filter(e=>!c.ev[e.id]);
  const gone=Object.keys(c.ev).filter(id=>!ids.has(id));
  const col=gref.collection("events");
  for(let i=0;i<todo.length;i+=400){
    const part=todo.slice(i,i+400),b=fs.batch();
    part.forEach(e=>b.set(col.doc(e.id),clean({...e,by:me})));
    await b.commit();part.forEach(e=>{c.ev[e.id]=1;});
  }
  for(let i=0;i<gone.length;i+=400){
    const part=gone.slice(i,i+400),b=fs.batch();
    part.forEach(id=>b.delete(col.doc(id)));
    await b.commit();part.forEach(id=>{delete c.ev[id];});
  }
}
async function syncTeam(t,me){
  const games=S.games.filter(x=>x.teamId===t.id&&x.cloud&&x.cloud.role==="owner"&&!x.cloud.off)
    .sort((a,b)=>b.date.localeCompare(a.date)).slice(0,80)
    .map(x=>({id:x.cloud.gid,opp:x.opp||"",date:x.date,us:usScore(x),them:x.oppScore||0,done:!!x.done}));
  const d=clean({owner:me,name:t.name,grade:t.grade||"",games});
  const h=JSON.stringify(d);
  if(h!==t.ch){await fs.collection("teams").doc(t.cloudId).set(d);t.ch=h;}
}
setInterval(()=>{if(hasCloud())syncAll();},15000);
window.addEventListener("online",()=>{if(hasCloud())syncAll();});

/* ----- live listeners: owner hears helper events; helper hears scorekeeper + events ----- */
function applyMeta(g,d){
  g.opp=d.opp||"";g.oppScore=d.them||0;g.q=d.q||1;g.done=!!d.done;g.needLineup=!!d.needLineup;
  g.floor=d.floorIds||[];g.qStart=d.qStart||{};g.floorSize=d.floorSize||g.floorSize;
  g.fmt=d.fmt||"q";g.periods=d.periods||4;g.plen=d.plen||7;g.ot=d.ot||[];g.assign=d.assign||null;
}
function listen(g0){
  const c=g0.cloud,gid=g0.id;
  if(!c||subs[gid]||!fbInit())return;
  const G=()=>S.games.find(x=>x.id===gid);
  const gref=fs.collection("games").doc(c.gid),un=[];
  un.push(gref.collection("events").onSnapshot(snap=>{
    if(snap.metadata&&snap.metadata.fromCache)return;
    fbAuth().then(me=>{
      const g=G();if(!g||!g.cloud)return;
      const ids=new Set(snap.docs.map(d=>d.id));
      const rem=snap.docs.map(d=>d.data()).filter(e=>e.by!==me).map(e=>({...e,remote:true}));
      // own events that the scorekeeper removed online are dropped here too
      g.events=g.events.filter(e=>!e.remote&&(!g.cloud.ev[e.id]||ids.has(e.id))).concat(rem).sort((a,b)=>(a.ts||0)-(b.ts||0));
      Object.keys(g.cloud.ev).forEach(id=>{if(!ids.has(id))delete g.cloud.ev[id];});
      save();
      if((view==="game"||view==="box")&&(S.gameId===g.id||boxId===g.id))render();
    }).catch(()=>{});
  },()=>{}));
  if(c.role==="helper"){
    un.push(gref.onSnapshot(s=>{
      const g=G();if(!g||!g.cloud)return;
      if(!s.exists){g.cloud.gone=true;save(true);toast("The scorekeeper stopped sharing this game");return;}
      applyMeta(g,s.data());
      if(sel&&!myStats(g).includes(sel))sel=null;
      if(g.done&&view==="game"&&S.gameId===g.id){boxId=g.id;view="box";}
      save(true);
      if(view==="game"||view==="box")render();
    },()=>{}));
  }
  subs[gid]=()=>un.forEach(u=>{try{u();}catch(e){}});
}
function resumeListeners(){
  S.games.forEach(g=>{const c=g.cloud;if(c&&!c.off&&!c.gone&&(c.role==="helper"?!g.done:c.collab))listen(g);});
}

/* ----- owner actions ----- */
async function shareGame(g){
  const t=S.teams.find(x=>x.id===g.teamId);
  if(!t)throw new Error("Team not found");
  if(!t.cloudId)t.cloudId=newId(14);
  g.cloud={gid:newId(14),tid:t.cloudId,role:"owner",h:"",ev:{},collab:false,codes:[]};
  save(true);
  await syncGame(g);
  save(true);
}
async function addHelper(g){
  const c=g.cloud;
  await syncGame(g);
  const code=newId(8);
  await fs.collection("games").doc(c.gid).collection("codes").doc(code).set({t:Date.now()});
  c.codes.push(code);
  if(!c.collab&&!g.assign){g.assign=defaultAssign();Object.keys(g.assign).forEach(k=>{if(k!=="pts")g.assign[k]="helper";});}
  c.collab=true;
  save(true);listen(g);
  await syncGame(g);
  save(true);
  return code;
}
async function unshare(g){
  const c=g.cloud;if(!c)return;
  await fbAuth();
  const gref=fs.collection("games").doc(c.gid);
  if(c.role==="owner"){
    const batchDel=async refs=>{for(let i=0;i<refs.length;i+=400){const b=fs.batch();refs.slice(i,i+400).forEach(r=>b.delete(r));await b.commit();}};
    const ev=await gref.collection("events").get();
    await batchDel(ev.docs.map(d=>gref.collection("events").doc(d.id)));
    try{const hs=await gref.collection("helpers").get();await batchDel(hs.docs.map(d=>gref.collection("helpers").doc(d.id)));}catch(e){}
    await batchDel((c.codes||[]).map(k=>gref.collection("codes").doc(k)));
    await gref.delete();
  }
  if(subs[g.id]){subs[g.id]();delete subs[g.id];}
  g.cloud=null;save(true);
  const t=S.teams.find(x=>x.id===g.teamId);
  if(t&&t.cloudId){try{await syncTeam(t,await fbAuth());}catch(e){}}
  save(true);
}

/* ----- helper phone ----- */
function parseJoin(str){
  const s=String(str||"");
  const m=s.match(/[?&]j=([a-z0-9]+)\.([a-z0-9]+)/i)||s.match(/([a-z0-9]{10,})\.([a-z0-9]{6,})/i);
  return m?[m[1],m[2]]:null;
}
async function joinGame(gid,code){
  const me=await fbAuth();
  const gref=fs.collection("games").doc(gid);
  const href=gref.collection("helpers").doc(me);
  const hs=await href.get();
  if(!hs.exists)await href.set({code});
  const s=await gref.get();
  if(!s.exists)throw new Error("Game not found");
  const d=s.data();
  const old=S.games.find(x=>x.cloud&&x.cloud.gid===gid&&x.cloud.role==="helper");
  if(old){listen(old);return old;}
  const g={id:newId(8),teamId:"__helper",teamName:d.teamName,grade:d.grade||"",date:d.date,opp:d.opp||"",oppScore:d.them||0,q:d.q||1,floorSize:d.floorSize||5,
    roster:(d.roster||[]).map(p=>({id:p.id,num:p.n,name:p.nm})),floor:d.floorIds||[],qStart:d.qStart||{},events:[],clock:{el:0,run:null},cu:{},
    needLineup:!!d.needLineup,done:!!d.done,cloud:{gid:gid,role:"helper",ev:{}},fmt:d.fmt||"q",periods:d.periods||4,plen:d.plen||7,ot:d.ot||[],assign:d.assign||null};
  S.games.push(g);save(true);listen(g);return g;
}
async function doJoin(str){
  const m=parseJoin(str);
  if(!m){toast("That doesn't look like a helper link");return;}
  toast("Joining…");
  try{
    const g=await joinGame(m[0],m[1]);
    S.gameId=g.id;sel=null;subMode=false;
    try{history.replaceState(null,"",BASE);}catch(e){}
    view="game";save(true);render();window.scrollTo(0,0);
  }catch(e){toast("Couldn't join: "+(e&&e.message?e.message:"check the link and your signal"));}
}

/* ----- public viewer pages (no sign-in needed) ----- */
function startView(){
  if(!fbInit()){V.loaded=true;render();return;}
  fs.collection("games").doc(V.gid).onSnapshot(s=>{V.doc=s.exists?s.data():null;V.tid=V.doc?V.doc.teamId:null;V.loaded=true;render();},()=>{V.loaded=true;render();});
}
function loadTeam(){
  if(!fbInit()){V.loaded=true;render();return;}
  fs.collection("teams").doc(V.tid).get().then(s=>{V.team=s.exists?s.data():null;V.loaded=true;render();}).catch(()=>{V.loaded=true;render();});
}
async function loadSeason(){
  const list=((V.team&&V.team.games)||[]).filter(x=>x.done);
  const docs=await Promise.all(list.map(x=>fs.collection("games").doc(x.id).get().then(s=>s.exists?s.data():null).catch(()=>null)));
  const A={};let w=0,l=0,pf=0,pa=0,n=0;
  docs.forEach(d=>{
    if(!d)return;n++;
    if(d.us>d.them)w++;else if(d.us<d.them)l++;pf+=d.us;pa+=d.them;
    (d.box||[]).forEach(r=>{
      if(!(r.min>0||r.pts||r.ast||r.to||r.stl||r.reb||r.blk||r.pf))return;
      const k=r.n+"|"+r.nm,a=A[k]||(A[k]={n:r.n,nm:r.nm,gp:0,pts:0,ast:0,to:0,stl:0,reb:0,blk:0,pf:0,min:0});
      a.gp++;for(const f of ["pts","ast","to","stl","reb","blk","pf","min"])a[f]+=r[f]||0;
    });
  });
  V.season={rows:Object.values(A).sort((a,b)=>(parseInt(a.n,10)||0)-(parseInt(b.n,10)||0)),w,l,pf,pa,n};
  render();
}
const viewHdr=(t,s)=>hdr(t,s);
const ftime=d=>d&&d.toDate?d.toDate().toLocaleTimeString([],{hour:"numeric",minute:"2-digit"}):"";
function vVgame(){
  const d=V.doc;
  const foot=`<div style="margin-top:14px">${V.tid?`<a class="lnk" href="${BASE}?t=${esc(V.tid)}">All games &amp; season stats</a>`:""}<a class="lnk" href="${BASE}">Open the stat tracker</a></div>`;
  if(!V.loaded)return viewHdr("Loading…","")+`<div class="pad"><div class="hint" style="padding:0">Loading game…</div></div>`;
  if(!d)return viewHdr("Game not available","")+`<div class="pad"><div class="help">This game isn't available. It may have been removed, or you may be offline.</div>${foot}</div>`;
  const r=d.us>d.them?"W":d.us<d.them?"L":"T";
  const rows=(d.box||[]).map(p=>`<tr class="${p.on&&!d.done?"onfl":""}"><td>${esc(p.n)}</td><td class="nm">${esc(p.nm)}</td><td><b>${p.pts}</b></td><td>${p.ast}</td><td>${p.to}</td><td>${p.stl}</td><td>${p.reb}</td><td>${p.blk}</td><td>${p.pf}</td><td>${p.min}</td></tr>`).join("");
  const tot={};["pts","ast","to","stl","reb","blk","pf"].forEach(k=>tot[k]=(d.box||[]).reduce((a,p)=>a+(p[k]||0),0));
  return viewHdr(d.teamName,`${d.grade?d.grade+" ":""}vs ${d.opp||"Opponent"}`)+`<div class="pad">
  <div class="fin ${d.done?r:""}">${esc(d.teamName)} ${d.us} – ${esc(d.opp||"Opp")} ${d.them}</div>
  <div class="hint" style="text-align:center;padding:0 0 10px">${d.done?"Final":"<b style='color:#ff2a35'>LIVE</b> · "+plabel(d,d.q)}${ftime(d.updated)?" · updated "+ftime(d.updated):""}</div>
  <div class="tbl"><table><tr><th>#</th><th class="nm">PLAYER</th><th>PTS</th><th>AST</th><th>TO</th><th>STL</th><th>REB</th><th>BLK</th><th>PF</th><th>MIN</th></tr>${rows}
  <tr class="tot"><td></td><td class="nm">TEAM</td><td>${tot.pts}</td><td>${tot.ast}</td><td>${tot.to}</td><td>${tot.stl}</td><td>${tot.reb}</td><td>${tot.blk}</td><td>${tot.pf}</td><td></td></tr></table></div>
  ${d.done?"":`<div class="hint" style="padding:6px 0">Players on the floor are highlighted. This page updates by itself.</div>`}
  ${foot}</div>`;
}
function vVteam(){
  const foot=`<a class="lnk" href="${BASE}">Open the stat tracker</a>`;
  if(!V.loaded)return viewHdr("Loading…","")+`<div class="pad"><div class="hint" style="padding:0">Loading…</div></div>`;
  const t=V.team;
  if(!t)return viewHdr("Team not available","")+`<div class="pad"><div class="help">This team page isn't available. You may be offline.</div>${foot}</div>`;
  const games=(t.games||[]).slice().sort((a,b)=>b.date.localeCompare(a.date));
  const s=V.season;
  const season=s?`<div class="fin">${s.w}–${s.l} · ${s.pf} for, ${s.pa} against</div><div class="tbl"><table><tr><th>#</th><th class="nm">PLAYER</th><th>GP</th><th>PTS</th><th>PPG</th><th>AST</th><th>TO</th><th>STL</th><th>REB</th><th>BLK</th><th>PF</th><th>MPG</th></tr>${s.rows.map(a=>`<tr><td>${esc(a.n)}</td><td class="nm">${esc(a.nm)}</td><td>${a.gp}</td><td><b>${a.pts}</b></td><td>${(a.pts/a.gp).toFixed(1)}</td><td>${a.ast}</td><td>${a.to}</td><td>${a.stl}</td><td>${a.reb}</td><td>${a.blk}</td><td>${a.pf}</td><td>${Math.round(a.min/a.gp)}</td></tr>`).join("")}</table></div>`:
    `<button class="big" data-a="season2" ${games.some(g=>g.done)?"":"disabled"}>Season Totals</button>`;
  return viewHdr(t.name,t.grade||"Games &amp; stats")+`<div class="pad">
  ${season}
  <h3>Games</h3><div class="list">${games.length?games.map(g=>{const r=g.us>g.them?"W":g.us<g.them?"L":"T";return `<a class="it" href="${BASE}?g=${esc(g.id)}"><div><b>vs ${esc(g.opp||"Opponent")}</b><br><small>${fmtDate(g.date)}${g.done?"":" · LIVE"}</small></div><div class="${g.done?r:""}"><b>${g.done?r+" ":""}${g.us}–${g.them}</b></div></a>`;}).join(""):`<div class="it"><small>No games shared yet.</small></div>`}</div>
  <div style="margin-top:16px">${foot}</div></div>`;
}
function vJoin(){
  return viewHdr("Join as a stat helper","Second phone")+`<div class="pad">
  <div class="help">You're about to help track a live game. The scorekeeper runs the lineup and subs. You'll see who's on the floor and can log stats.<br><br>Tip: ask the scorekeeper which stats you're covering (for example assists, rebounds, steals) so nothing is counted twice.</div>
  <button class="big red" data-a="joinnow">Join Game</button><a class="lnk" href="${BASE}">Not now</a></div>`;
}

/* ----- sharing sheet ----- */
const syncLabel=()=>syncState==="ok"?"synced":navigator.onLine===false?"offline — will catch up":"syncing…";
function openShare(g){
  const c=g.cloud;if(!c)return;
  const gl=`${BASE}?g=${c.gid}`,tl=`${BASE}?t=${c.tid}`;
  const hl=c.codes&&c.codes.length?`${BASE}?j=${c.gid}.${c.codes[c.codes.length-1]}`:"";
  const row=(id,val,t)=>`<input readonly id="${id}" value="${esc(val)}"><div class="row"><button data-a="cpin" data-id="${id}">Copy</button><button class="red" data-a="shin" data-id="${id}" data-t="${esc(t)}">Share</button></div>`;
  openSheet(`<h2>Live Sharing</h2><div class="cnt">Status: ${syncLabel()}</div>
  <label>This game — view only</label>${row("l1",gl,g.teamName+" live game")}
  <label>Team page — all games &amp; season stats</label>${row("l2",tl,g.teamName+" stats")}
  <label>Second Phone (Stat Helper)</label>
  ${hl?row("l3",hl,"Help track "+g.teamName):""}
  <button data-a="helper" style="width:100%;margin-top:6px">${hl?"Make a New Helper Link":"Create Helper Link"}</button>
  <div class="row" style="margin-top:14px"><button class="ghost" data-a="unshare">Stop Sharing</button><button class="red" data-a="close">Done</button></div>`);
}

function liveBlock(g){
  if(isHelper(g))return "";
  return `<h3>Live link for parents</h3>`+(isOwner(g)?`<div class="hint" style="padding:0 0 8px">Shared online · ${syncLabel()}</div><button class="big red" data-a="sharesheet">Links &amp; Helper Phone</button>`:`<button class="big red" data-a="golive">Share This Game Online</button>`);
}
(function route(){
  const q=new URLSearchParams(location.search);
  if(q.get("g")){view="vgame";V.gid=q.get("g");startView();}
  else if(q.get("t")){view="vteam";V.tid=q.get("t");loadTeam();}
  else if(q.get("j")){view="join";V.j=location.search;}
})();
resumeListeners();
if(view==="home"&&hasCloud())queueSync();

window.addEventListener("pageshow",refreshFromStore);
document.addEventListener("visibilitychange",()=>{if(!document.hidden)refreshFromStore();});
window.addEventListener("focus",refreshFromStore);
window.addEventListener("storage",e=>{if(e.key===KEY)refreshFromStore();});
document.addEventListener("click",e=>{
  if(e.target.classList&&e.target.classList.contains("ov")){closeSheet();return;}
  const el=e.target.closest("[data-a]");if(!el)return;
  const f=A[el.dataset.a];if(f)f(el.dataset,el);
});
document.addEventListener("change",e=>{const el=e.target,f=el.dataset&&el.dataset.f;if(f&&F[f])F[f](el);});
document.addEventListener("input",e=>{const el=e.target,f=el.dataset&&el.dataset.f;if(f&&el.dataset.live&&F[f])F[f](el);});
try{if("serviceWorker" in navigator&&/^https?:/.test(location.protocol))navigator.serviceWorker.register("sw.js").catch(()=>{});}catch(e){}
try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist();}catch(e){}
render();
